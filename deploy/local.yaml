apiVersion: v1
kind: Namespace
metadata:
  name: f1-replay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: f1-replay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.4.12-alpine
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: f1-replay
spec:
  selector:
    app: redis
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: replay
  namespace: f1-replay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: replay
  template:
    metadata:
      labels:
        app: replay
    spec:
      containers:
        - name: replay
          image: f1-race-replay:local
          imagePullPolicy: Never
          args: ["-addr", ":8080", "-recording", "/barcelona-2026-grid.json"]
          env:
            - name: REPLAY_REDIS_URL
              value: redis://redis:6379/0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: replay
  namespace: f1-replay
spec:
  type: NodePort
  selector:
    app: replay
  ports:
    - port: 8080
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: f1-replay
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: discover-replay-pods
  namespace: f1-replay
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus-discover-replay-pods
  namespace: f1-replay
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: f1-replay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: discover-replay-pods
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
  namespace: f1-replay
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      scrape_timeout: 1s
    scrape_configs:
      - job_name: replay
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [f1-replay]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_name]
            action: keep
            regex: replay;http
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: f1-replay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.16.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: f1-replay
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
