apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: f1-replay
resources:
  - grafana.yaml
configMapGenerator:
  - name: grafana-prometheus
    files:
      - datasource.yaml
  - name: grafana-dashboard-provider
    files:
      - provider.yaml
  - name: grafana-replay-dashboard
    files:
      - replay.json
